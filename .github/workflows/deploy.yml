name: Deploy demo to metacrystal.com/groveminder

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # This repo publishes the DEMO (DEPLOY_MODE: demo). A real site is a theme
      # repo with its own workflow: see theme-template/deploy.yml and
      # README → "Making a theme". The upload itself lives in tools/deploy.sh,
      # which both use. Sign-in: README → "Deploy key".
      - name: Upload via SFTP
        env:
          DEPLOY_HOST:     metacrystal.com
          DEPLOY_DEST:     /home/${{ secrets.SFTP_USER }}/metacrystal.com/groveminder
          DEPLOY_MODE:     demo
          SFTP_USER:       ${{ secrets.SFTP_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSHPASS:         ${{ secrets.SFTP_PASSWORD }}
        run: bash tools/deploy.sh

      - name: Confirm
        run: echo "✅ Deployed the demo to metacrystal.com/groveminder/"
