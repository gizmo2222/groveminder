# Deploy workflow for a site built on GroveMinder (a "theme").
# Copy this file to .github/workflows/deploy.yml in the theme repo and change
# the four values marked CHANGE. See the GroveMinder README → "Making a theme".
#
# The theme repo holds only its own files (site-config.js, images,
# .github/known_hosts). Every deploy fetches the GroveMinder product at the
# pinned version below and uploads the two together, so the theme never
# carries a copy of the product's pages or PHP.

name: Deploy to example.com                # CHANGE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this theme
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          path: theme

      # To take a newer GroveMinder, set `ref` to the commit SHA of its release tag
      # (in groveminder: git rev-parse v1.1.0^{commit}) and push. A tag can be moved; a SHA cannot.
      - name: Checkout GroveMinder at the pinned version
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          repository: gizmo2222/groveminder
          ref: v1.0.0                      # CHANGE when you upgrade
          path: groveminder

      - name: Upload via SFTP
        working-directory: groveminder
        env:
          DEPLOY_HOST:     example.com                                   # CHANGE
          DEPLOY_DEST:     /home/${{ secrets.SFTP_USER }}/example.com    # CHANGE
          THEME_DIR:       ../theme
          # Extra files to upload besides site-config.js and its heroImage
          THEME_FILES:     ""
          SFTP_USER:       ${{ secrets.SFTP_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSHPASS:         ${{ secrets.SFTP_PASSWORD }}
        run: bash tools/deploy.sh
